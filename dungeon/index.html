<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬戰鬥 - SFL 多人副本模擬器</title>
    <meta name="description" content="SFL 多人關卡模擬戰鬥系統">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --primary-glow: rgba(78, 201, 176, 0.3);
            --accent-color: #4ec9b0;
            --bg-dark: #0f111a;
            --card-bg: rgba(30, 33, 45, 0.8);
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .app-header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #4ec9b0 0%, #6200ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .app-header p {
            color: #888;
            font-size: 1.1rem;
        }

        /* 敵人選擇區 */
        #enemy-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeInUp 0.8s ease-out;
        }

        .enemy-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .enemy-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--primary-glow);
        }

        .enemy-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0;
            background: var(--accent-color);
            transition: height 0.3s ease;
        }

        .enemy-card:hover::before {
            height: 100%;
        }

        .enemy-card h3 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 1.4rem;
        }

        .enemy-card .level-tag {
            font-size: 0.8rem;
            color: var(--accent-color);
            background: rgba(78, 201, 176, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .enemy-card .desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 挑戰詳情區 */
        #challenge-detail-view {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #222;
            color: #fff;
            border-color: #666;
        }

        .challenge-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        .config-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: fit-content;
        }

        .config-group {
            margin-bottom: 25px;
        }

        .config-group label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .config-group input {
            width: 100%;
            padding: 12px;
            background: #0a0c12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ec9b0 0%, #2b927d 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(78, 201, 176, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 201, 176, 0.5);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .btn-outline:hover {
            background: rgba(78, 201, 176, 0.1);
        }

        .battle-log-area {
            background: #0a0c12;
            border-radius: 20px;
            border: 1px solid #1e212d;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            padding: 15px 25px;
            background: #161922;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d4d4d4;
        }

        .log-entry {
            margin-bottom: 8px;
        }

        .log-success {
            color: #4ec9b0;
        }

        .log-fail {
            color: #f44747;
        }

        .log-info {
            color: #9cdcfe;
        }

        .log-player {
            color: #4ec9b0;
        }

        .log-enemy {
            color: #ffab91;
        }

        .log-round {
            color: #ce9178;
            font-weight: bold;
            border-top: 1px dashed #333;
            margin-top: 15px;
            padding-top: 5px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f111a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>SFL 多人副本模擬器</h1>
        </header>

        <main>
            <!-- 敵人選擇視圖 -->
            <section id="enemy-selection-grid">
                <!-- 動態生成敵人卡片 -->
            </section>

            <!-- 挑戰詳情視圖 -->
            <section id="challenge-detail-view">
                <div class="detail-header">
                    <button class="back-btn" id="btn-back">← 返回列表</button>
                    <h2 id="view-enemy-name" style="margin:0; color:#fff; font-size:2rem;">敵人名稱</h2>
                </div>

                <div class="challenge-layout">
                    <!-- 左側配置 -->
                    <div class="config-panel">
                        <div class="config-group">
                            <label>重複挑戰次數 (1-1000)</label>
                            <input type="number" id="input-repeat-count" value="1" min="1" max="1000">
                        </div>

                        <button class="btn btn-outline" id="btn-single-test">單場測試 (顯示日誌)</button>
                        <button class="btn btn-primary" id="btn-start-challenge">開始連續挑戰</button>

                        <div id="quick-stats" style="margin-top:20px; padding-top:20px; border-top:1px solid #333;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <span style="color:#888;">成功率</span>
                                <span id="stat-win-rate" style="color:#4ec9b0; font-weight:bold;">0%</span>
                            </div>
                            <div style="display:flex; justify-content:space-between;">
                                <span style="color:#888;">累計場次</span>
                                <span id="stat-total" style="color:#fff;">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- 右側日誌 -->
                    <div class="battle-log-area">
                        <div class="log-header">
                            <span style="color:#888; font-size:0.9rem;">戰鬥實況戰報</span>
                            <button onclick="document.getElementById('log-display').innerHTML=''"
                                style="background:none; border:none; color:#555; cursor:pointer; font-size:0.8rem;">清除紀錄</button>
                        </div>
                        <div class="log-content" id="log-display">
                            <!-- 戰報顯示 -->
                            <div class="log-entry log-info">等待開始...</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 基礎腳本 -->
    <script src="../fight/attribute.js"></script>
    <script src="../character/skill.js"></script>
    <script src="enemy/enemy.js"></script>
    <script src="dungeon.js"></script>
</body>

</html>
